<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Consulta de CEP</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body>

    <main class="container">

        <section class="caixa1">

            <h1>Consulta de CEP</h1>

            <p>Digite o CEP para encontrar o endereço.</p>

            <div class="formulario">
                <div class="campo">
                    <label for="campoTexto">CEP:</label>

                    <input
                        type="text"
                        id="campoTexto"
                        class="input-cep"
                        placeholder="Digite o CEP"
                        maxlength="8"
                    >
                </div>

                <button type="button" id="btnConsultar" class="btn-consultar">
                    Consultar
                </button>

                <button type="button" id="btnLimpar" class="btn-limpar">
                    Limpar
                </button>
            </div>
            
            <div id="display" class="resultado"></div>
        </section>
    </main>
</body>

</html>
